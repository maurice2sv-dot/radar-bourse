name: radar-bourse
on:
  schedule:
    - cron: "37 22 * * 1-5"  # 22h37 UTC, après la clôture de New York (envoi de 6 h GMT)
    - cron: "7 8 * * 1-5"    # 08h07 UTC, passage de jour (envoi de 17 h GMT). Avancé depuis 14h07 le 23/11/2026 :
                             # GitHub l'avait lancé avec 5 à 8 h de retard (départ vers 22 h). La séance européenne
                             # en cours est écartée : ce passage reprend la clôture de la veille et l'Asie.
    # GitHub déclenche souvent avec retard : ces horaires laissent de la marge.
                             # lancer la veille au soir garantit un brief prêt le lendemain matin.
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Tests automatiques (méthode, portefeuille, contrôles, brief)
        run: python -m pytest -q tests
      - name: Récupérer la base (release « base »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release view base >/dev/null 2>&1; then
            gh release download base -p radar.db -D data --clobber || { echo "Base illisible : arrêt pour ne pas repartir d'un journal vide"; exit 1; }
          elif [ -f data/radar.db ]; then
            gh release create base data/radar.db -t "Base du radar" -n "Base SQLite du radar, remplacée chaque soir, sauvegarde chaque vendredi. Ne pas supprimer."
          else
            echo "Ni release ni base : arrêt"; exit 1
          fi
      - run: python run.py --mode live
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          STOOQ_APIKEY: ${{ secrets.STOOQ_APIKEY }}  # facultatif : clé Stooq pour le contrôle croisé (sinon nasdaq.com)
          GH_TOKEN: ${{ github.token }}  # lecture du dépôt public fja05680/sp500 (composition historique)
      - name: Sauvegarder la base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import sqlite3;c=sqlite3.connect('data/radar.db');assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok';assert c.execute('SELECT COUNT(*) FROM predictions').fetchone()[0]>0"
          gh release upload base data/radar.db --clobber
          if [ "$(date -u +%u)" = "5" ]; then f="data/radar-$(date -u +%G-S%V).db"; cp data/radar.db "$f"; gh release upload base "$f" --clobber; fi
      - name: Sauvegarde de la base et des briefs
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch data/radar.db
          git add data dashboard.html
          git commit -m "Radar $(date -u +%F)" || echo "rien à enregistrer"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 15; done
          exit 1
      - name: Signaler l'échec dans le brief
        if: failure()
        run: |
          mkdir -p data
          echo "Radar bourse : ÉCHEC de l'exécution du $(date -u +%F). Aucune prévision aujourd'hui. Voir l'onglet Actions du dépôt." > data/brief.md
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/brief.md
          git commit -m "Radar en échec $(date -u +%F)" || true
          git push || true
