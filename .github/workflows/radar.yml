name: radar-bourse
on:
  schedule:
    # Déclenchement toutes les heures, tous les jours : les horaires planifiés de GitHub ne sont pas garantis
    # (retards de 5 à 8 h, et passages jamais lancés, comme le lundi 23/11/2026). La garde (radar/passage.py)
    # ne lance le calcul qu'une fois par créneau : « soir » après 22h UTC (clôture de New York) et « jour »
    # après 7h UTC (clôture de l'Asie), du lundi au vendredi. Les autres déclenchements s'arrêtent en quelques
    # secondes. À chaque déclenchement, les flux RSS sont archivés dans data/rss (calibrage des technologies).
    - cron: "23 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  garde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.garde.outputs.go }}
      creneau: ${{ steps.garde.outputs.creneau }}
    steps:
      - uses: actions/checkout@v4
      - name: Archiver les flux RSS (data/rss)
        run: python3 -m radar.rss || true
      - name: Enregistrer l'archive RSS
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/rss
          git commit -q -m "Flux RSS $(date -u '+%F %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 10; done
          echo "archive RSS non poussée (sera reprise au prochain déclenchement)"
      - id: garde
        name: Passage dû ?
        env:
          RADAR_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 -m radar.passage
  run:
    needs: garde
    if: needs.garde.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Tests automatiques (méthode, portefeuille, contrôles, brief)
        run: python -m pytest -q tests
      - name: Récupérer la base (release « base »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release view base >/dev/null 2>&1; then
            gh release download base -p radar.db -D data --clobber || { echo "Base illisible : arrêt pour ne pas repartir d'un journal vide"; exit 1; }
          elif [ -f data/radar.db ]; then
            gh release create base data/radar.db -t "Base du radar" -n "Base SQLite du radar, remplacée chaque soir, sauvegarde chaque vendredi. Ne pas supprimer."
          else
            echo "Ni release ni base : arrêt"; exit 1
          fi
      - run: python run.py --mode live
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          STOOQ_APIKEY: ${{ secrets.STOOQ_APIKEY }}  # facultatif : clé Stooq pour le contrôle croisé (sinon nasdaq.com)
          GH_TOKEN: ${{ github.token }}  # lecture du dépôt public fja05680/sp500 (composition historique)
      - name: Sauvegarder la base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import sqlite3;c=sqlite3.connect('data/radar.db');assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok';assert c.execute('SELECT COUNT(*) FROM predictions').fetchone()[0]>0"
          gh release upload base data/radar.db --clobber
          if [ "$(date -u +%u)" = "5" ]; then f="data/radar-$(date -u +%G-S%V).db"; cp data/radar.db "$f"; gh release upload base "$f" --clobber; fi
      - name: Sauvegarde de la base et des briefs
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          RADAR_CRENEAU="${{ needs.garde.outputs.creneau }}" python -m radar.passage noter
          git rm -q --cached --ignore-unmatch data/radar.db
          git add data dashboard.html
          git commit -m "Radar $(date -u +%F)" || echo "rien à enregistrer"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 15; done
          exit 1
      - name: Signaler l'échec dans le brief
        if: failure()
        run: |
          mkdir -p data
          echo "Radar bourse : ÉCHEC de l'exécution du $(date -u +%F). Aucune prévision aujourd'hui. Voir l'onglet Actions du dépôt." > data/brief.md
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/brief.md
          git commit -m "Radar en échec $(date -u +%F)" || true
          git push || true
