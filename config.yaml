mode: demo              # demo = données synthétiques | live = yfinance + flux RSS
db_path: data/radar.db
horizons: [1, 5, 20]    # en jours de bourse
main_horizon: 5
replay_dates: 20        # points de rejeu point-in-time pour amorcer le journal
demo:
  seed: 7
  years: 3
  shock: 0.03           # intensité des effets cachés des événements (démo seulement)
  sources:              # fiabilité cachée (démo) : l'outil doit la retrouver
    Agence_A: 0.90
    Presse_B: 0.80
    Blog_C: 0.50
    Reseaux_D: 0.30
gdelt:                  # historique mondial d'actualités, collecté par le workflow horaire (run_gdelt.py)
  enabled: true
  years: 3
  pause: 10             # secondes entre requêtes (limite GDELT : 5 s, adresses partagées sur GitHub)
  per_run: 3            # séries au plus par passage horaire ; arrêt au premier refus
  budget_s: 360
  tickers: [AAPL, MSFT, NVDA, GOOGL, META, ASML, AMZN, TSLA, JPM, BNP.PA, XOM, TTE.PA, LMT, RTX, HO.PA, SAF.PA, AIR.PA, MC.PA, LLY, SAN.PA]   # séries par entreprise suivies dans GDELT (limite de débit)
feeds:                  # mode live 
  lemonde_inter: https://www.lemonde.fr/international/rss_full.xml
  lemonde_eco: https://www.lemonde.fr/economie/rss_full.xml
  bbc_world: https://feeds.bbci.co.uk/news/world/rss.xml
  bbc_business: https://feeds.bbci.co.uk/news/business/rss.xml
  france24: https://www.france24.com/fr/rss
marches:                # indicateurs de marché (yfinance) : contexte des secteurs et alertes de risque
  VIX: ^VIX
  Taux US 10 ans: ^TNX
  Pétrole WTI: CL=F
  Dollar: DX-Y.NYB
  Or: GC=F
  EUR/USD: EURUSD=X
calendrier:
  max_par_passage: 70   # valeurs dont on rafraîchit les dates de résultats à chaque passage (cycle d'une semaine)
  banques_centrales:    # dates de décision. Sources : federalreserve.gov (2027 révisé le 12/11/2026), ecb.europa.eu
    Fed: [2023-11-01, 2023-12-13, 2024-01-31, 2024-03-20, 2024-05-01, 2024-06-12, 2024-07-31, 2024-09-18, 2024-11-07, 2024-12-18,
          2025-01-29, 2025-03-19, 2025-05-07, 2025-06-18, 2025-07-30, 2025-09-17, 2025-10-29, 2025-12-10,
          2026-01-28, 2026-03-18, 2026-04-29, 2026-06-17, 2026-07-29, 2026-09-16, 2026-10-28, 2026-12-09,
          2027-01-27, 2027-03-17, 2027-04-28, 2027-06-09, 2027-07-28, 2027-09-15, 2027-11-17]
    BCE: [2023-10-26, 2023-12-14, 2024-01-25, 2024-03-07, 2024-04-11, 2024-06-06, 2024-07-18, 2024-09-12, 2024-10-17, 2024-12-12,
          2025-01-30, 2025-03-06, 2025-04-17, 2025-06-05, 2025-07-24, 2025-09-11, 2025-10-30, 2025-12-18,
          2026-02-05, 2026-03-19, 2026-04-30, 2026-06-11, 2026-07-23, 2026-09-10, 2026-10-29, 2026-12-17,
          2027-02-04, 2027-03-18, 2027-04-29, 2027-06-10, 2027-07-22, 2027-09-09, 2027-10-28, 2027-12-16]
